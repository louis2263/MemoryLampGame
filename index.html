<!DOCTYPE html>

<!-- 載入 PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>

<style>

<body class="p-4 flex flex-col items-center select-none">

<!-- 頂部列 -->
<div class="w-full max-w-md flex justify-between items-center mb-4">
    <div class="text-xs font-bold text-yellow-300 bg-neutral-800 border border-neutral-700 px-3 py-1 rounded-full">v2.1 穩定多人版</div>
    <h1 class="text-xl font-black text-center m-0"><span class="bg-gradient-to-r from-yellow-300 to-emerald-400 bg-clip-text text-transparent">方包包 燈號對決</span></h1>
    <div id="connectionStatus" class="text-xs px-2 py-1 bg-red-900/65 text-red-300 border border-red-700 rounded-full">未連線</div>
</div>

<!-- 1. 大廳畫面 -->
<div id="lobbyScreen" class="w-full max-w-md flex flex-col gap-4">
    <div class="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl shadow-xl flex flex-col gap-4">
        <h2 class="text-base font-bold text-yellow-200">🎮 遊戲大廳 / 多人連線</h2>
        <div>
            <label class="text-xs text-neutral-400 mb-1 block">您的玩家暱稱：</label>
            <input type="text" id="playerNameInput" value="方包包玩家" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-400 font-bold">
        </div>
        
        <div class="grid grid-cols-2 gap-3 mt-2">

                <span class="text-lg">👑 建立多人房</span>
                <span class="text-[10px] opacity-80 mt-0.5">做 Host 讓朋友加入</span>
            </button>
            <button onclick="showJoinModal()" class="bg-gradient-to-r from-yellow-400 to-amber-500 hover:opacity-90 active:scale-95 transition text-black font-black py-3 px-4 rounded-xl shadow-lg flex flex-col items-center justify-center cursor-pointer">
                <span class="text-lg">🚪 加入房間</span>
                <span class="text-[10px] opacity-80 mt-0.5">輸入代碼連線</span>
            </button>
        </div>
    </div>

    <div class="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl shadow-xl">

        <p class="text-xs text-neutral-400 leading-relaxed">
            支援多位玩家同時連線！房主建立房間後會獲得一個<b>4位數代碼</b>。朋友輸入該代碼即可加入房間。當中央燈號轉為<b>綠燈</b>時鬥快按下搶答！紅燈偷跑會被扣分！
        </p>

<!-- 2. 房主等待室 -->
<div id="hostScreen" class="w-full max-w-md hidden flex-col gap-4">
    <div class="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl shadow-xl text-center flex flex-col gap-3">
        <h2 class="text-base font-bold text-emerald-400">👑 多人房間已建立</h2>
        <p class="text-xs text-neutral-400">請將以下 4 位數房間代碼分享給朋友：</p>
        <div class="bg-neutral-800 border border-neutral-700 py-3 px-4 rounded-xl flex items-center justify-between">
            <span id="roomCodeDisplay" class="text-3xl font-mono font-black text-yellow-300 tracking-widest">----</span>
            <button onclick="copyRoomCode()" class="bg-neutral-700 hover:bg-neutral-600 text-xs px-3 py-2 rounded-lg font-bold cursor-pointer">複製代碼</button>
        </div>
        
        <div class="text-left mt-2">
            <div class="text-xs text-neutral-400 mb-1 font-bold">已連接的玩家：</div>
            <div id="playersListContainer" class="bg-neutral-800/60 border border-neutral-700/60 rounded-xl p-3 max-h-32 overflow-y-auto flex flex-col gap-1.5 text-xs">
                <div class="text-neutral-500">等待玩家加入中...</div>
            </div>
        </div>

        <button id="startMatchBtn" onclick="startMatch()" disabled class="mt-2 w-full bg-neutral-800 text-neutral-500 font-black py-3 rounded-xl transition cursor-not-allowed">開始對決</button>
        <button onclick="backToLobby()" class="mt-1 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-xs py-2 rounded-xl cursor-pointer">返回大廳</button>
    </div>
</div>

<!-- 3. 加入房間畫面 -->
<div id="joinScreen" class="w-full max-w-md hidden flex-col gap-4">
    <div class="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl shadow-xl flex flex-col gap-4">
        <h2 class="text-base font-bold text-yellow-300">🚪 加入多人房間</h2>
        <div>
            <label class="text-xs text-neutral-400 mb-1 block">輸入房主的 4 位數房間代碼：</label>
            <input type="text" id="targetPeerIdInput" placeholder="例如: 4829" maxlength="4" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-400 font-mono text-2xl tracking-widest text-center">
        </div>
        <div id="joinStatusText" class="text-xs text-center text-neutral-400 min-h-[16px]"></div>
        <div class="flex gap-2">
            <button onclick="connectToPeer()" class="flex-1 bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-black py-3 rounded-xl cursor-pointer">連線</button>
            <button onclick="backToLobby()" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-bold py-3 px-5 rounded-xl cursor-pointer">返回</button>
        </div>
    </div>
</div>

<!-- 4. 遊戲主畫面 -->
<div id="gameScreen" class="w-full max-w-md hidden flex-col gap-4">
    <!-- 即時分數排行榜 -->
    <div class="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl shadow-xl">
        <div class="text-xs font-bold text-neutral-400 mb-2 text-center">🏆 即時分數排行榜</div>
        <div id="scoreboardContainer" class="flex flex-col gap-1.5 max-h-28 overflow-y-auto">
            <!-- 動態插入各玩家分數 -->
        </div>
    </div>

    <!-- 燈號箱 -->
    <div id="lightBox" class="bg-neutral-900 border-2 border-neutral-800 h-56 rounded-3xl flex flex-col items-center justify-center shadow-inner transition-all duration-300">
        <div id="lightBulb" class="w-28 h-28 rounded-full bg-neutral-800 border-4 border-neutral-700 shadow-lg flex items-center justify-center transition-all duration-200">
            <span id="lightText" class="text-xs font-black text-neutral-400">準備中</span>
        </div>
        <div id="instructionText" class="mt-4 text-sm font-bold text-neutral-400 text-center px-4">等待房主開始回合...</div>
    </div>

    <!-- 搶答按鈕 -->
    <button id="actionBtn" onclick="playerAction()" disabled class="w-full py-6 rounded-2xl bg-neutral-800 text-neutral-500 text-xl font-black shadow-2xl transition active:scale-95 cursor-not-allowed">
        燈未亮，切勿按！
    </button>
    <button onclick="backToLobby()" class="w-full bg-neutral-900 border border-neutral-800 hover:bg-neutral-800 text-neutral-400 text-xs py-3 rounded-xl cursor-pointer mt-2">離開房間 / 重新連線</button>
</div>

<script>
let peer = null;
let isHost = false;
let myName = '方包包玩家';
let myPeerId = '';
let connections = {}; // 房主記錄所有客戶端連線 {peerId: conn}
let hostConn = null;  // 客戶端記錄與房主的連線

let players = {}; // 記錄所有玩家名稱與分數 {peerId: {name, score}}

let gameState = {
    status: 'IDLE',
    lightState: 'RED',
    startTime: 0,
    timeoutId: null
};

function showScreen(screenId) {
    ['lobbyScreen', 'hostScreen', 'joinScreen', 'gameScreen'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
        document.getElementById(id).classList.remove('flex');
    });
    const target = document.getElementById(screenId);
    target.classList.remove('hidden');
    target.classList.add('flex');
}

function updateStatus(text, type='error') {
    const statusEl = document.getElementById('connectionStatus');
    statusEl.innerText = text;
    if(type === 'success') {
        statusEl.className = 'text-xs px-2 py-1 bg-emerald-900/65 text-emerald-300 border border-emerald-700 rounded-full';
    } else if(type === 'warning') {
        statusEl.className = 'text-xs px-2 py-1 bg-yellow-900/65 text-yellow-300 border border-yellow-700 rounded-full';
    } else {
        statusEl.className = 'text-xs px-2 py-1 bg-red-900/65 text-red-300 border border-red-700 rounded-full';
    }
}

// 產生 4 位數隨機房號
function generateRoomCode() {
    return Math.floor(1000 + Math.random() * 9000).toString();
}

// 建立房間 (Host)
function hostGame() {
    myName = document.getElementById('playerNameInput').value.trim() || '方包包玩家';
    isHost = true;
    updateStatus('建立中...', 'warning');
    
    const code = generateRoomCode();
    myPeerId = 'bagel-v2-' + code;
    
    if(peer) { peer.destroy(); }
    
    // 使用穩定嘅 PeerJS 設定
    peer = new Peer(myPeerId, {
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        debug: 1
    });

    peer.on('open', (id) => {
        document.getElementById('roomCodeDisplay').innerText = code;
        players[peer.id] = { name: myName + ' (房主)', score: 0 };
        updatePlayersListUI();
        showScreen('hostScreen');
        updateStatus('房間已就緒', 'success');
    });

    peer.on('connection', (conn) => {
        conn.on('open', () => {
            connections[conn.peer] = conn;
            // 立即發送現有玩家清單
            conn.send({ type: 'UPDATE_PLAYERS', players: players });
        });

        conn.on('data', (data) => {
            handleServerData(conn.peer, data);
        });

        conn.on('close', () => {
            delete connections[conn.peer];
            delete players[conn.peer];
            updatePlayersListUI();
            broadcastPlayersList();
        });
    });

    peer.on('error', (err) => {
        console.error('Peer Error:', err);
        if(err.type === 'unavailable-id') {
            hostGame(); // 房號重複則重試
        } else {
            updateStatus('建立失敗，請重試');
        }
    });
}

function showJoinModal() {
    isHost = false;
    showScreen('joinScreen');
}

function backToLobby() {
    if(peer) {
        peer.destroy();
        peer = null;
    }
    connections = {};
    hostConn = null;
    players = {};
    isHost = false;
    updateStatus('未連線', 'error');
    showScreen('lobbyScreen');
}

// 加入房間 (Client)
function connectToPeer() {
    const codeInput = document.getElementById('targetPeerIdInput').value.trim();
    const joinStatus = document.getElementById('joinStatusText');
    
    if(!codeInput || codeInput.length !== 4) {
        joinStatus.innerText = '請輸入正確的 4 位數房間代碼！';
        joinStatus.className = 'text-xs text-center text-red-400';
        return;
    }
    
    myName = document.getElementById('playerNameInput').value.trim() || '方包包玩家';
    updateStatus('連線中...', 'warning');
    joinStatus.innerText = '正在連線至房主房間...';
    joinStatus.className = 'text-xs text-center text-yellow-400';
    
    if(peer) { peer.destroy(); }
    
    peer = new Peer({
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        debug: 1
    });
    
    peer.on('open', (id) => {
        myPeerId = id;
        const targetFullId = 'bagel-v2-' + codeInput;
        hostConn = peer.connect(targetFullId);
        
        hostConn.on('open', () => {
            updateStatus('已連線', 'success');
            hostConn.send({ type: 'JOIN_ROOM', name: myName });
            showScreen('gameScreen');
        });

        hostConn.on('data', (data) => {
            handleClientData(data);
        });

        hostConn.on('close', () => {
            updateStatus('房主已斷線', 'error');
            alert('房主已關閉房間！');
            backToLobby();
        });
    });
    
    peer.on('error', (err) => {
        console.error('Connect Error:', err);
        updateStatus('連線失敗');
        joinStatus.innerText = '找不到該房間，請核對 4 位代碼！';
        joinStatus.className = 'text-xs text-center text-red-400';
    });
}

function copyRoomCode() {
    const code = document.getElementById('roomCodeDisplay').innerText;
    if(navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => {
            alert('已複製房號代碼：' + code);
        });
    } else {
        const tempInput = document.createElement('input');
        tempInput.value = code;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        alert('已複製房號代碼：' + code);
    }
}

function broadcast(data) {
    for(let id in connections) {
        if(connections[id].open) {
            connections[id].send(data);
        }
    }
}

function broadcastPlayersList() {
    broadcast({ type: 'UPDATE_PLAYERS', players: players });
    updateScoreboardUI();
}

function updatePlayersListUI() {
    const container = document.getElementById('playersListContainer');
    container.innerHTML = '';
    
    let count = 0;
    for(let id in players) {
        count++;
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center bg-neutral-900/80 px-2.5 py-1.5 rounded-lg';
        div.innerHTML = `<span class="font-bold text-white">${players[id].name}</span><span class="text-emerald-400 text-[10px]">已就緒</span>`;
        container.appendChild(div);
    }
    
    const startBtn = document.getElementById('startMatchBtn');
    if(count >= 1) {
        startBtn.disabled = false;
        startBtn.className = 'mt-2 w-full bg-gradient-to-r from-emerald-400 to-teal-500 text-black font-black py-3 rounded-xl shadow-lg hover:opacity-95 active:scale-95 transition cursor-pointer';
        startBtn.innerText = `開始對決 (共 ${count} 人)`;
    } else {
        startBtn.disabled = true;
        startBtn.className = 'mt-2 w-full bg-neutral-800 text-neutral-500 font-black py-3 rounded-xl transition cursor-not-allowed';
    }
}

// 房主接收客戶端數據
function handleServerData(senderId, data) {
    switch(data.type) {
        case 'JOIN_ROOM':
            players[senderId] = { name: data.name, score: 0 };
            updatePlayersListUI();
            broadcastPlayersList();
            break;
        case 'PLAYER_ACTION':
            handlePlayerAction(senderId, data.time, data.isEarly);
            break;
    }
}

// 客戶端接收房主數據
function handleClientData(data) {
    switch(data.type) {
        case 'UPDATE_PLAYERS':
            players = data.players;
            updateScoreboardUI();
            break;
        case 'START_ROUND':
            triggerRedLightPhase();
            break;
        case 'LIGHT_GREEN':
            triggerGreenLightPhase(data.startTime);
            break;
        case 'ROUND_RESULT':
            document.getElementById('instructionText').innerText = data.message;
            break;
    }
}

function startMatch() {
    if(!isHost) return;
    for(let id in players) {
        players[id].score = 0;
    }
    showScreen('gameScreen');
    broadcastPlayersList();
    nextRound();
}

function nextRound() {
    if(!isHost) return;
    broadcast({ type: 'START_ROUND' });
    triggerRedLightPhase();
}

function triggerRedLightPhase() {
    gameState.lightState = 'RED';
    gameState.status = 'WAITING';
    
    const bulb = document.getElementById('lightBulb');
    const text = document.getElementById('lightText');
    const inst = document.getElementById('instructionText');
    const btn = document.getElementById('actionBtn');

    bulb.className = 'w-28 h-28 rounded-full bg-red-600 border-4 border-red-500 shadow-lg shadow-red-900/50 flex items-center justify-center transition-all duration-200 animate-pulse';
    text.innerText = '紅燈';
    text.className = 'text-xs font-black text-white';
    inst.innerText = '燈號正紅，請勿按！等待綠燈亮起...';
    
    btn.disabled = false;
    btn.className = 'w-full py-6 rounded-2xl bg-gradient-to-r from-red-600 to-rose-700 text-white text-xl font-black shadow-2xl hover:opacity-95 active:scale-95 transition cursor-pointer';
    btn.innerText = ' 點擊搶答 / 偷跑測試 ';

    if(isHost) {
        const randomDelay = Math.floor(Math.random() * 3000) + 2000;
        gameState.timeoutId = setTimeout(() => {
            const startTime = Date.now();
            gameState.startTime = startTime;
            broadcast({ type: 'LIGHT_GREEN', startTime: startTime });
            triggerGreenLightPhase(startTime);
        }, randomDelay);
    }
}

function triggerGreenLightPhase(startTime) {
    gameState.lightState = 'GREEN';
    gameState.status = 'READY';
    gameState.startTime = startTime;

    const bulb = document.getElementById('lightBulb');
    const text = document.getElementById('lightText');
    const inst = document.getElementById('instructionText');
    const btn = document.getElementById('actionBtn');

    bulb.className = 'w-28 h-28 rounded-full bg-emerald-500 border-4 border-emerald-400 shadow-lg shadow-emerald-900/50 flex items-center justify-center transition-all duration-200 animate-bounce';
    text.innerText = '綠燈！';
    text.className = 'text-xs font-black text-black';
    inst.innerText = '🟢 綠燈亮起！立刻按下！';
    
    btn.className = 'w-full py-6 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-500 text-black text-xl font-black shadow-2xl hover:opacity-95 active:scale-95 transition cursor-pointer';
    btn.innerText = ' ⚡ 立即按下！ ';
}

let hasAnsweredThisRound = false;

function playerAction() {
    if(hasAnsweredThisRound) return;
    hasAnsweredThisRound = true;

    const now = Date.now();
    const btn = document.getElementById('actionBtn');
    btn.disabled = true;

    if(gameState.lightState === 'RED') {
        document.getElementById('instructionText').innerText = '❌ 偷跑犯規！扣一分！';
        btn.className = 'w-full py-6 rounded-2xl bg-neutral-800 text-neutral-500 text-xl font-black shadow-2xl cursor-not-allowed';
        btn.innerText = '犯規被罰';

        if(isHost) {
            clearTimeout(gameState.timeoutId);
            if(players[myPeerId]) {
                players[myPeerId].score = Math.max(0, players[myPeerId].score - 1);
            }
            broadcastPlayersList();
            setTimeout(() => { hasAnsweredThisRound = false; nextRound(); }, 2500);
        } else {
            hostConn.send({ type: 'PLAYER_ACTION', time: now, isEarly: true });
        }
    } else if(gameState.lightState === 'GREEN') {
        const reactionTime = now - gameState.startTime;
        document.getElementById('instructionText').innerText = `⚡ 反應時間：${reactionTime} ms`;
        btn.className = 'w-full py-6 rounded-2xl bg-neutral-800 text-neutral-500 text-xl font-black shadow-2xl cursor-not-allowed';
        btn.innerText = `${reactionTime} ms`;

        if(isHost) {
            if(players[myPeerId]) {
                players[myPeerId].score += 1;
            }
            broadcastPlayersList();
            broadcast({ type: 'ROUND_RESULT', message: `🎉 本回合由 ${players[myPeerId]?.name || '玩家'} 率先搶中！(${reactionTime} ms)` });
            setTimeout(() => { hasAnsweredThisRound = false; nextRound(); }, 3000);
        } else {
            hostConn.send({ type: 'PLAYER_ACTION', time: reactionTime, isEarly: false });
        }
    }
}

// 房主處理來自任何客戶端的搶答
function handlePlayerAction(senderId, time, isEarly) {
    if(!isHost) return;
    
    const pName = players[senderId]?.name || '對手';
    if(isEarly) {
        if(players[senderId]) {
            players[senderId].score = Math.max(0, players[senderId].score - 1);
        }
        broadcast({ type: 'ROUND_RESULT', message: `⚠️ ${pName} 偷跑犯規被扣分！` });
    } else {
        if(players[senderId]) {
            players[senderId].score += 1;
        }
        broadcast({ type: 'ROUND_RESULT', message: `🏆 ${pName} 搶答成功！反應：${time} ms` });
        broadcastPlayersList();
        
        setTimeout(() => {
            nextRound();
        }, 3000);
    }
    bro
