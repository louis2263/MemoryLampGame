<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方包包 V9.9 強制出燈</title>
<style>
*{box-sizing:border-box;font-family:'Noto Sans HK',sans-serif}
body{margin:0;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.topBar{width:92%;max-width:420px;display:flex;justify-content:space-between;margin:10px 0}.ver{background:#FFEB00;color:#000;padding:4px 12px;border-radius:99px;font-weight:900;font-size:12px}
.h1{font-size:22px;font-weight:900;margin:6px 0}.h1 b{background:linear-gradient(90deg,#FFEB00,#00FF88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs,.lvls{display:flex;gap:6px;width:92%;max-width:420px;margin:6px 0}.tab,.lvl{flex:1;padding:12px;border-radius:12px;border:2px solid #333;background:#111;color:#888;font-weight:900}.tab.active{border-color:#FFEB00;color:#FFEB00;background:#FFEB0022}.lvl.active{border-color:#00FF88;color:#00FF88;background:#00FF8822}
.pillRow{display:flex;gap:6px;margin:10px 0}.pill{background:#1a1a1a;border:1px solid #333;padding:6px 14px;border-radius:99px;font-size:13px}.pill b{color:#FFEB00}
.flash{color:#FFEB00;font-weight:900;text-align:center;margin:12px 0;font-size:20px;min-height:28px}
.board{width:92%;max-width:420px;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.light{width:100%;height:88px;border-radius:20px;border:0;font-size:22px;font-weight:900;color:#fff;cursor:pointer;transition:.15s}
.light:active{transform:scale(.97)}
.light.on{filter:brightness(1.8);box-shadow:0 0 30px currentColor;transform:scale(1.02)}
#l0{background:#D00000} #l1{background:#E6A700;color:#000} #l2{background:#00A835}
#l3{background:#0055D0} #l4{background:#8A00C2}
.controls{width:92%;max-width:420px;display:flex;gap:8px;margin:20px 0}.btn{flex:1;padding:16px;border-radius:99px;border:0;font-weight:900;font-size:16px}.btnY{background:#FFEB00;color:#000}.btnG{background:#222;color:#fff}
#mainLB{width:92%;max-width:420px;margin-top:14px}
.row{display:flex;justify-content:space-between;background:#1a1a1a;padding:12px;border-radius:12px;border:1px solid #222;margin-top:6px}
.row.me{border-color:#FFEB00;background:#2a2a00}
.row.win{border-color:#FFEB00;background:linear-gradient(90deg,#FFEB0022,#00FF8822)}
</style>
</head><body>
<div class="topBar"><div style="font-size:12px;color:#666">方包包</div><div class="ver">V9.9 強制出燈</div></div>
<div class="h1"><b>燈號對決</b></div>

<div class="tabs"><button class="tab active" id="tabS" onclick="setTab('single')">單人</button><button class="tab" id="tabP" onclick="setTab('party')">本地多人</button><button class="tab" id="tabR" onclick="setTab('room')">淘汰賽房間</button></div>
<div class="lvls"><button class="lvl active" id="lvl3" onclick="setMode(3)">3盞</button><button class="lvl" id="lvl4" onclick="setMode(4)">4盞</button><button class="lvl" id="lvl5" onclick="setMode(5)">5盞</button></div>

<div class="pillRow"><div class="pill">關卡 <b id="level">0</b></div><div class="pill">生存 <b id="aliveCount">1</b></div><div class="pill">狀態 <b id="status">V9.9正常</b></div></div>
<div class="flash" id="flashText">V9.9 - 燈掣一定睇到，可按</div>

<!-- 強制寫死喺HTML，唔靠JS生 -->
<div class="board" id="board">
  <button class="light" id="l0" onclick="handlePress(0)">🔴 紅</button>
  <button class="light" id="l1" onclick="handlePress(1)">🟡 黃</button>
  <button class="light" id="l2" onclick="handlePress(2)">🟢 綠</button>
  <button class="light" id="l3" onclick="handlePress(3)" style="display:none">🔵 藍</button>
  <button class="light" id="l4" onclick="handlePress(4)" style="display:none">🟣 紫</button>
</div>

<div id="mainLB"></div>
<div class="controls"><button class="btn btnY" id="btnStart">▶️ 開始</button><button class="btn btnG" id="btnReset">↻ 重置</button></div>

<script>
let mode=3, seq=[], player=[], level=0, playing=false, showing=false, startTime=0;
let myName='玩家', aliveList=['玩家'], outList=[], outOrder=[], levelResults=[], gameEnded=false;
const colors=['#D00000','#E6A700','#00A835','#0055D0','#8A00C2'];
const $=id=>document.getElementById(id);
function setTab(m){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); if(m==='single') $('tabS').classList.add('active'); if(m==='party') $('tabP').classList.add('active'); if(m==='room') $('tabR').classList.add('active'); }
function setMode(m){
 mode=m;
 document.querySelectorAll('.lvl').forEach(b=>b.classList.remove('active'));
 $('lvl'+m).classList.add('active');
 for(let i=0;i<5;i++){
   let el=$('l'+i);
   if(i<m) el.style.display='block';
   else el.style.display='none';
 }
 $('status').textContent=m+'盞已顯示';
}
function lightOn(i){
 let el=$('l'+i);
 if(!el) return;
 el.classList.add('on');
 setTimeout(()=>el.classList.remove('on'),350);
}
function doCountdown(){
 return new Promise(async (resolve)=>{
   $('flashText').style.display='none';
   let cd=document.createElement('div');
   cd.style.fontSize='80px'; cd.style.fontWeight='900'; cd.style.textAlign='center'; cd.style.margin='20px 0';
   cd.id='tempCd';
   $('board').before(cd);
   for(let c=3;c>=1;c--){ cd.textContent=c; await new Promise(r=>setTimeout(r,600)); }
   cd.textContent='GO!'; await new Promise(r=>setTimeout(r,400)); cd.remove();
   $('flashText').style.display='block'; resolve();
 });
}
async function showSequence(){
 showing=true;
 $('flashText').textContent='第'+level+'關 - 睇 '+seq.length+' 盞';
 for(let i=0;i<seq.length;i++){ await new Promise(r=>setTimeout(r,300)); lightOn(seq[i]); await new Promise(r=>setTimeout(r,600)); }
 showing=false;
 $('flashText').textContent='第'+level+'關 - 按 '+seq.length+' 盞';
 startTime=performance.now(); player=[];
}
async function nextLevel(){
 level++; $('level').textContent=level;
 seq.push(Math.floor(Math.random()*mode));
 await showSequence();
}
async function startGame(){
 if(playing) return;
 seq=[]; level=0; player=[]; gameEnded=false; outList=[]; outOrder=[]; levelResults=[];
 $('mainLB').innerHTML=''; $('status').textContent='遊戲中';
 playing=true;
 await doCountdown();
 await nextLevel();
}
function handlePress(i){
 if(!playing||showing||gameEnded) { lightOn(i); return; }
 lightOn(i);
 player.push(i);
 let idx=player.length-1;
 if(player[idx]!==seq[idx]){
   $('flashText').textContent='❌ 按錯！第'+level+'關失敗';
   playing=false;
   setTimeout(()=>{ $('flashText').textContent='按開始重試'; $('status').textContent='失敗'; },1000);
   return;
 }
 if(player.length===seq.length){
   let t=((performance.now()-startTime)/1000).toFixed(2);
   $('flashText').textContent='✅ 第'+level+'關完成 '+t+'s';
   if(mode===3 && level>=1 && aliveList.length===1){
     // 模擬淘汰賽剩1人即停
     // endGameWithWinner(aliveList[0]);
   }
   setTimeout(()=>nextLevel(),900);
 }
}
function resetGame(){
 playing=false; showing=false; gameEnded=false; seq=[]; player=[]; level=0;
 $('level').textContent=0; $('flashText').textContent='V9.9 - 燈掣一定睇到，可按'; $('mainLB').innerHTML=''; $('status').textContent='V9.9正常';
}
$('btnStart').onclick=startGame;
$('btnReset').onclick=resetGame;
setMode(3);
</script>
</body></html>
