<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方包包 燈號對決 P2P真同步</title>
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@700;900&display=swap');
*{box-sizing:border-box;font-family:'Noto Sans HK',sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:30px}
.h1{font-size:20px;font-weight:900;text-align:center;margin:10px 0 0}.h1 b{background:linear-gradient(90deg,#FFEB00,#00FF88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:6px;margin:8px 0;width:92%;max-width:420px}.tab{flex:1;padding:10px;border-radius:12px;border:2px solid #333;background:#111;color:#888;font-weight:900;font-size:13px;cursor:pointer}.tab.active{border-color:#FFEB00;background:#FFEB0022;color:#FFEB00}
.levelSel{display:flex;gap:6px;margin:6px 0;width:92%;max-width:420px}.lvl{flex:1;padding:8px;border-radius:10px;border:2px solid #333;background:#111;color:#fff;font-weight:900;font-size:12px;cursor:pointer}.lvl.active{border-color:#00FF88;color:#00FF88;background:#00FF8822}
.pillRow{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap;justify-content:center}.pill{background:#1a1a1a;border:1px solid #333;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700}.pill b{color:#FFEB00}
.flashText{font-size:18px;font-weight:900;text-align:center;margin:6px 0;min-height:24px;color:#FFEB00}.timeText{font-size:13px;text-align:center;min-height:20px;color:#aaa}
.countdown{font-size:64px;font-weight:900;text-align:center;height:70px;line-height:70px;display:none}.countdown.show{display:block;animation:pop 0.35s ease}@keyframes pop{0%{transform:scale(0.5)}100%{transform:scale(1)}}
.board{display:grid;gap:10px;width:92%;max-width:420px;margin-top:8px}.board.c3{grid-template-columns:1fr}.board.c4{grid-template-columns:1fr 1fr}.board.c5{grid-template-columns:1fr 1fr}
.light{width:100%;height:78px;border-radius:18px;border:0;font-size:18px;font-weight:900;cursor:pointer;transition:0.1s;opacity:0.35;pointer-events:none;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,0.8);box-shadow:0 5px 0 rgba(0,0,0,0.5)}
.light.active{opacity:1;pointer-events:auto}.light.on{opacity:1;filter:brightness(1.8);box-shadow:0 0 25px currentColor,0 0 50px currentColor;transform:scale(1.03)}
.controls{margin-top:12px;width:92%;max-width:420px;display:flex;gap:8px}.btn{flex:1;padding:14px;border-radius:99px;border:0;font-weight:900;font-size:14px;cursor:pointer}.btn-yellow{background:#FFEB00;color:#000}.btn-gray{background:#222;color:#fff}
.multiBox{width:92%;max-width:420px;background:#121212;border:1px solid #333;border-radius:16px;padding:12px;margin-top:10px}
.roomCode{font-size:32px;font-weight:900;letter-spacing:8px;text-align:center;color:#00FF88;margin:8px 0}
.pRow{display:flex;justify-content:space-between;align-items:center;background:#000;padding:9px 12px;border-radius:10px;border:1px solid #222;margin-top:6px;font-size:13px}
</style>
</head><body>
<div class="h1"><b>方包包 燈號對決</b></div>
<div class="tabs">
<button class="tab active" id="tabSingle" onclick="setPlayMode('single')">單人玩</button>
<button class="tab" id="tabParty" onclick="setPlayMode('party')">多人一齊</button>
<button class="tab" id="tabRoom" onclick="setPlayMode('room')">真同步房間</button>
</div>
<div class="levelSel"><button class="lvl active" id="lvl3" onclick="setMode(3)">3盞</button><button class="lvl" id="lvl4" onclick="setMode(4)">4盞</button><button class="lvl" id="lvl5" onclick="setMode(5)">5盞</button></div>
<div class="pillRow"><div class="pill">關卡 <b id="level">0</b></div><div class="pill">狀態 <b id="status">未連線</b></div><div class="pill" id="timePill" style="display:none">⏱️ <b id="lastTime">0.00</b>s</div></div>
<div class="flashText" id="flashText">揀模式開始</div>
<div class="countdown" id="cd">3</div>
<div class="timeText" id="timeText"></div>
<div class="board c3" id="board"></div>
<div class="controls"><button class="btn btn-yellow" id="btnStart">▶️ 開始</button><button class="btn btn-gray" id="btnReset">↻ 重置</button></div>

<div class="multiBox" id="roomBox" style="display:none">
<div style="font-weight:900;font-size:14px">🌐 P2P真同步 - 唔使後台</div>
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-yellow" onclick="createRoom()">開新房間</button><button class="btn btn-gray" onclick="joinPrompt()">加入房間</button></div>
<div id="roomInfo" style="display:none"><div class="roomCode" id="roomCode">----</div><div style="text-align:center;font-size:11px;color:#888">Share俾朋友一齊入<br><span id="roomLink" style="color:#00FF88;word-break:break-all"></span><br><button class="btn btn-gray" style="margin-top:8px;padding:8px 16px;font-size:12px" onclick="copyLink()">📋 複製Link</button></div></div>
<div id="roomPlayers" style="margin-top:8px"></div>
<div id="leaderboard" style="margin-top:8px"></div>
<div style="font-size:10px;color:#555;margin-top:8px;text-align:center">連唔到？兩部機轉用4G，唔好用公司WiFi</div>
</div>

<script>
let playMode='single', mode=3, seq=[], player=[], level=0, playing=false, showing=false, startTime=0;
let peer=null, connList=[], myConn=null, isHost=false, roomId=null;
let myName='玩家'+Math.floor(Math.random()*90+10);
let results=[];
const colors=[
 {bg:'#D00000',label:'🔴 紅',f:440},
 {bg:'#E6A700',label:'🟡 黃',f:550},
 {bg:'#00A835',label:'🟢 綠',f:660},
 {bg:'#0055D0',label:'🔵 藍',f:770},
 {bg:'#8A00C2',label:'🟣 紫',f:880}
];
const $=id=>document.getElementById(id);
let audioCtx=null;
function getCtx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function beep(f,d,v=0.4){ try{ const c=getCtx(); const o=c.createOscillator(); const g=c.createGain(); o.frequency.value=f; g.gain.value=v; o.connect(g); g.connect(c.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+d); o.stop(c.currentTime+d);}catch{}}
function setPlayMode(m){
 playMode=m;
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 $('tab'+(m==='single'?'Single':m==='party'?'Party':'Room')).classList.add('active');
 $('roomBox').style.display=m==='room'?'block':'none';
 resetGame(); checkUrl();
}
function setMode(m){
 mode=m;
 document.querySelectorAll('.lvl').forEach(b=>b.classList.remove('active'));
 $('lvl'+m).classList.add('active');
 buildBoard();
 if(isHost) broadcast({type:'mode',mode:m});
 resetGame();
}
function buildBoard(){
 const b=$('board'); b.innerHTML=''; b.className='board c'+mode;
 for(let i=0;i<mode;i++){
  let btn=document.createElement('button'); btn.className='light'; btn.id='light'+i;
  btn.style.background=colors[i].bg; btn.textContent=colors[i].label;
  btn.onclick=()=>handlePress(i); b.appendChild(btn);
 }
 setActive(false);
}
function setActive(o){ document.querySelectorAll('.light').forEach(l=>{ if(o) l.classList.add('active'); else l.classList.remove('active'); }); }
function lightOn(i){ let el=$('light'+i); if(!el) return; el.classList.add('on'); beep(colors[i].f,0.22,0.4); setTimeout(()=>el.classList.remove('on'),280); }
async function doCountdown(){
 $('flashText').style.display='none'; $('cd').style.display='block'; $('cd').classList.add('show');
 for(let c=3;c>=1;c--){ $('cd').textContent=c; $('cd').classList.remove('show'); void $('cd').offsetWidth; $('cd').classList.add('show'); beep(800,0.12,0.5); await new Promise(r=>setTimeout(r,600)); }
 $('cd').textContent='GO!'; beep(1200,0.35,0.6); await new Promise(r=>setTimeout(r,400));
 $('cd').style.display='none'; $('flashText').style.display='block';
}
function startTimer(){ startTime=performance.now(); $('timeText').textContent='⏱️ 計時中...'; $('timePill').style.display='none'; }
function stopTimer(){ let e=(performance.now()-startTime)/1000; $('timePill').style.display='inline-flex'; $('lastTime').textContent=e.toFixed(2); return e; }
async function showSequence(){
 showing=true; setActive(false); $('flashText').textContent=`提示 ${seq.length} 盞 - 睇住`; $('timeText').textContent='';
 for(let i=0;i<seq.length;i++){ await new Promise(r=>setTimeout(r,250)); lightOn(seq[i]); await new Promise(r=>setTimeout(r,550)); }
 showing=false; setActive(true); $('flashText').textContent=`輪到你 - 按 ${seq.length} 盞`; startTimer(); player=[];
}
async function nextLevel(){
 level++; $('level').textContent=level; seq.push(Math.floor(Math.random()*mode));
 if(isHost) broadcast({type:'seq',seq,level});
 await showSequence();
}
async function startGame(){
 getCtx();
 if(playMode==='room' &&!peer){ alert('請先開房或加入房間'); return; }
 if(playMode==='room' &&!isHost){ $('flashText').textContent='等房主開始...'; return; }
 seq=[]; player=[]; level=0; results=[]; $('level').textContent=0; $('leaderboard').innerHTML=''; setActive(false); playing=true; await doCountdown(); await nextLevel();
}
function handlePress(i){
 if(!playing||showing) return;
 lightOn(i); player.push(i); let idx=player.length-1;
 if(player[idx]!==seq[idx]){
   $('flashText').textContent='❌ 錯咗！'; beep(150,0.6,0.5); playing=false; setActive(false);
   if(playMode==='room') sendResult(999,false);
   return;
 }
 if(player.length===seq.length){
   let t=stopTimer();
   if(playMode==='single'){ $('flashText').textContent='✅ 啱晒！'; $('timeText').innerHTML=`第 ${level} 關：<b style="color:#00FF88">${t.toFixed(2)}秒</b>`; setTimeout(()=>nextLevel(),1200); }
   else { $('flashText').textContent='✅ 完成！等其他人...'; sendResult(t,true); setActive(false); }
 }
}
function resetGame(){ seq=[]; player=[]; level=0; playing=false; showing=false; $('level').textContent=0; $('flashText').textContent='按開始'; $('timeText').textContent=''; $('timePill').style.display='none'; setActive(false); }
function createRoom(){
 roomId=Math.random().toString(36).substring(2,6).toUpperCase(); isHost=true; results=[];
 if(peer) peer.destroy();
 peer=new Peer('lamp-'+roomId);
 peer.on('open',()=>{ $('status').textContent='房主已開房'; $('roomCode').textContent=roomId; $('roomInfo').style.display='block'; let link=location.origin+location.pathname+'?room='+roomId; $('roomLink').textContent=link; history.replaceState(null,'','?room='+roomId); updatePlayerList(); });
 peer.on('connection', c=>{
   connList.push(c);
   c.on('data', d=>handleData(d,c));
   c.on('open',()=>{ c.send({type:'mode',mode}); updatePlayerList(); });
   c.on('close',()=>{ connList=connList.filter(x=>x!==c); updatePlayerList(); });
 });
 $('status').textContent='開房中...';
}
function joinPrompt(){ let c=prompt('輸入房間碼:'); if(!c) return; joinRoom(c.toUpperCase()); }
function joinRoom(code){
 roomId=code; isHost=false;
 if(peer) peer.destroy();
 peer=new Peer();
 peer.on('open',()=>{
   myConn=peer.connect('lamp-'+code,{reliable:true});
   myConn.on('open',()=>{ $('status').textContent='已連線 '+code; $('roomCode').textContent=code; $('roomInfo').style.display='block'; let link=location.href; $('roomLink').textContent=link; myConn.send({type:'join',name:myName}); });
   myConn.on('data', d=>handleData(d,myConn));
   myConn.on('error',()=>{ $('status').textContent='連線失敗，試4G'; });
 });
 peer.on('error',err=>{ if(err.type==='peer-unavailable'){ alert('房間不存在，檢查CODE'); } });
}
function handleData(data,conn){
 if(data.type==='mode'){ mode=data.mode; setMode(mode); buildBoard(); }
 if(data.type==='seq'){ seq=data.seq; level=data.level; $('level').textContent=level; playing=true; showSequence(); }
 if(data.type==='join' && isHost){ conn.playerName=data.name; updatePlayerList(); }
 if(data.type==='result'){ results.push({name:data.name,time:data.time,ok:data.ok}); renderLeaderboard(); }
 if(data.type==='leaderboard'){ $('leaderboard').innerHTML=data.html; }
}
function sendResult(t,ok){ let payload={type:'result',name:myName,time:t,ok}; if(isHost){ results.push(payload); renderLeaderboard(); } else if(myConn){ myConn.send(payload); } }
function broadcast(obj){ connList.forEach(c=>{ try{c.send(obj)}catch{}}); }
function renderLeaderboard
