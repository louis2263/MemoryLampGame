<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方包包 V15.1 超簡單</title>
<style>
body{margin:0;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:sans-serif;padding-bottom:30px}
.ver{background:#FFEB00;color:#000;padding:4px 12px;border-radius:99px;font-weight:900;font-size:12px;position:fixed;top:8px;right:8px;z-index:20}
.light{width:92%;max-width:420px;height:86px;border-radius:20px;border:0;margin:7px 0;font-size:22px;font-weight:900;color:#fff}
#l0{background:#D00000} #l1{background:#E6A700;color:#000} #l2{background:#00A835}
.btn{width:92%;max-width:420px;padding:16px;border-radius:99px;border:0;font-weight:900;font-size:17px;margin:6px 0}
.btnY{background:#FFEB00;color:#000}.btnG{background:#333;color:#fff}
.box{width:92%;max-width:420px;background:#121212;border:1px solid #444;border-radius:16px;padding:14px;margin-top:12px}
.nameI{width:100%;padding:12px;border-radius:10px;border:2px solid #555;background:#000;color:#fff;font-size:15px;font-weight:700}
.code{font-size:36px;font-weight:900;letter-spacing:8px;color:#00FF88;text-align:center;margin:8px 0}
#joinLog{font-size:13px;text-align:center;margin-top:8px;padding:12px;border-radius:8px;background:#222;color:#FFEB00;white-space:pre-line;border:1px solid #FFEB00}
</style>
</head><body>
<div class="ver">V15.1 超簡單一撳出碼</div>
<h1 style="margin:50px 0 8px;color:#FFEB00;font-size:26px">燈號對決</h1>
<div class="light" id="l0" style="background:#D00000">🔴 紅 - 撳我試下有冇反應</div>
<div id="flash" style="color:#FFEB00;font-weight:900;margin:12px">V15.1 測試掣得唔得</div>

<button class="btn btnY" onclick="alert('紅黃綠掣OK！');document.getElementById('flash').textContent='✅ 按鈕有反應！'">測試按鈕</button>

<div class="box">
<div style="font-weight:900">💀 淘汰賽房間 - 記憶王獎牌制</div>
<input id="nameInput" class="nameI" style="margin-top:10px" placeholder="Louis" value="Louis">
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btnY" style="flex:1" onclick="createRoom()">開新房間</button><button class="btn btnG" style="flex:1" onclick="alert('加入房間掣OK')">加入房間</button></div>
<div id="joinLog">準備就緒 - 按開新房間會即時出TEST碼</div>
<div id="roomInfo" style="display:none"><div class="code" id="roomCode">----</div><div id="roomLink" style="color:#00FF88;font-size:11px;word-break:break-all;text-align:center"></div></div>
</div>

<script>
function createRoom(){
  try{
    alert('收到開房！');
    var nameVal=document.getElementById('nameInput').value||'Louis';
    var code='TEST';
    document.getElementById('roomCode').textContent=code;
    document.getElementById('roomInfo').style.display='block';
    document.getElementById('joinLog').textContent='✅ 成功出碼！\n房號：'+code+'\n房主：'+nameVal+'\n\n如果見到呢個，證明開房掣100%得，之前係PeerJS搞死咗';
    document.getElementById('flash').textContent='✅ 開房掣正常！';
  }catch(e){
    alert('開房錯誤：'+e.message);
    document.getElementById('joinLog').textContent='❌ 錯誤：'+e.message;
  }
}
document.getElementById('l0').onclick=function(){ alert('紅掣得！'); document.getElementById('flash').textContent='✅ 紅掣有反應'; };
</script>
</body></html>
