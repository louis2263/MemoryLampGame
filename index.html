<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方包包 V11.1 單人一定得</title>
<style>
body{margin:0;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:sans-serif;padding-bottom:30px}
.ver{background:#FFEB00;color:#000;padding:4px 12px;border-radius:99px;font-weight:900;font-size:12px;position:fixed;top:8px;right:8px;z-index:10}
h1{margin:50px 0 10px;color:#FFEB00}
.flash{color:#FFEB00;font-weight:900;font-size:22px;margin:15px 0;min-height:30px;text-align:center}
#cd{font-size:90px;font-weight:900;color:#FFEB00;display:none;text-align:center;margin:10px}
.light{width:92%;max-width:400px;height:90px;border-radius:20px;border:0;margin:8px 0;font-size:24px;font-weight:900;color:#fff}
.light:active{transform:scale(.97)}
#l0{background:#D00000} #l1{background:#E6A700;color:#000} #l2{background:#00A835}
#l0.on,#l1.on,#l2.on{box-shadow:0 0 30px #fff;filter:brightness(1.5)}
.btn{width:92%;max-width:400px;padding:18px;border-radius:99px;border:0;font-weight:900;font-size:18px;margin:10px 0}
.btnY{background:#FFEB00;color:#000}.btnG{background:#333;color:#fff}
</style>
</head><body>
<div class="ver">V11.1 單人一定得</div>
<h1>燈號對決</h1>
<div class="flash" id="flash">V11.1 - 按開始一定有3-2-1-GO有聲</div>
<div id="cd">3</div>

<button class="light" id="l0" onclick="press(0)">🔴 紅</button>
<button class="light" id="l1" onclick="press(1)">🟡 黃</button>
<button class="light" id="l2" onclick="press(2)">🟢 綠</button>

<button class="btn btnY" onclick="startGame()">▶️ 開始</button>
<button class="btn btnG" onclick="resetGame()">↻ 重置</button>

<div id="level" style="margin-top:15px;color:#888">關卡 0</div>

<script>
let seq=[], player=[], level=0, playing=false, showing=false, startTime=0;
let audioCtx=null;
function getAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function beep(f,d){ try{ let ctx=getAudio(); let o=ctx.createOscillator(); let g=ctx.createGain(); o.frequency.value=f; g.gain.value=0.6; o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+d); o.stop(ctx.currentTime+d);}catch(e){} }

function lightOn(i){ let el=document.getElementById('l'+i); if(!el) return; el.classList.add('on'); beep([440,660,880][i],0.3); setTimeout(()=>el.classList.remove('on'),350); }

async function doCountdown(){
 document.getElementById('flash').style.display='none';
 let cd=document.getElementById('cd'); cd.style.display='block';
 for(let c=3;c>=1;c--){ cd.textContent=c; beep(900,0.2); await new Promise(r=>setTimeout(r,700)); }
 cd.textContent='GO!'; beep(1500,0.5); await new Promise(r=>setTimeout(r,500));
 cd.style.display='none'; document.getElementById('flash').style.display='block';
}
function startTimer(){ startTime=performance.now(); }
function stopTimer(){ return (performance.now()-startTime)/1000; }

async function showSeq(){
 showing=true; document.getElementById('flash').textContent='第'+level+'關 睇 '+seq.length+' 盞';
 for(let i=0;i<seq.length;i++){ await new Promise(r=>setTimeout(r,500)); lightOn(seq[i]); await new Promise(r=>setTimeout(r,700)); }
 showing=false; document.getElementById('flash').textContent='第'+level+'關 按 '+seq.length+' 盞'; startTimer(); player=[];
}
async function nextLevel(){
 level++; document.getElementById('level').textContent='關卡 '+level;
 seq.push(Math.floor(Math.random()*3));
 await showSeq();
}
async function startGame(){
 try{ getAudio(); }catch{}
 beep(600,0.1);
 if(playing) return;
 seq=[]; level=0; player=[]; playing=true;
 document.getElementById('flash').textContent='準備...';
 await doCountdown();
 await nextLevel();
}
function press(i){
 lightOn(i);
 if(!playing||showing) return;
 player.push(i);
 let idx=player.length-1;
 if(player[idx]!==seq[idx]){
   document.getElementById('flash').textContent='💀 按錯！出局！';
   beep(150,0.8); playing=false;
   setTimeout(()=>resetGame(),1500); return;
 }
 if(player.length===seq.length){
   let t=stopTimer().toFixed(2);
   document.getElementById('flash').textContent='✅ 第'+level+'關 '+t+'s 3秒後下一關';
   beep(1200,0.2);
   setTimeout(()=>nextLevel(),1200);
 }
}
function resetGame(){
 playing=false; showing=false; seq=[]; player=[]; level=0;
 document.getElementById('level').textContent='關卡 0';
 document.getElementById('flash').textContent='V11.1 就緒 - 按開始';
 document.getElementById('cd').style.display='none';
}
</script>
</body></html>
