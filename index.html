<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方包包 V9.3 三人穩定</title>
<style>
*{box-sizing:border-box;font-family:'Noto Sans HK',sans-serif}
body{margin:0;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:20px}
.topBar{width:92%;max-width:420px;display:flex;justify-content:space-between;margin:8px 0 0}.ver{font-size:11px;color:#000;background:#FFEB00;padding:4px 12px;border-radius:99px;font-weight:900}
.h1{font-size:20px;font-weight:900;margin:6px 0}.h1 b{background:linear-gradient(90deg,#FFEB00,#00FF88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs,.lvls{display:flex;gap:6px;width:92%;max-width:420px;margin:6px 0}.tab,.lvl{flex:1;padding:10px;border-radius:12px;border:2px solid #333;background:#111;color:#888;font-weight:900;font-size:12px}.tab.active{border-color:#FFEB00;color:#FFEB00;background:#FFEB0022}.lvl.active{border-color:#00FF88;color:#00FF88;background:#00FF8822}
.pillRow{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}.pill{background:#1a1a1a;border:1px solid #333;padding:5px 12px;border-radius:99px;font-size:12px}.pill b{color:#FFEB00}
.flash{color:#FFEB00;font-weight:900;text-align:center;margin:8px 0;min-height:22px;font-size:18px}.timeT{color:#aaa;font-size:12px;text-align:center;min-height:16px}
.cd{font-size:80px;font-weight:900;display:none;height:80px;line-height:80px;text-align:center;color:#fff;text-shadow:0 0 25px #FFEB00}.cd.show{display:block;animation:pop.3s ease}@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.board{display:grid;gap:12px;width:92%;max-width:420px;margin-top:10px}.c3{grid-template-columns:1fr}.c4{grid-template-columns:1fr 1fr}.c5{grid-template-columns:1fr 1fr}
.light{height:80px;border-radius:20px;border:0;font-size:19px;font-weight:900;color:#fff;opacity:.35;pointer-events:none}.light.active{opacity:1;pointer-events:auto}.light.on{filter:brightness(1.9);box-shadow:0 0 28px currentColor;transform:scale(1.03)}
.controls{display:flex;gap:8px;width:92%;max-width:420px;margin-top:14px}.btn{flex:1;padding:14px;border-radius:99px;border:0;font-weight:900;font-size:14px}.btnY{background:#FFEB00;color:#000}.btnG{background:#222;color:#fff}
.box{width:92%;max-width:420px;background:#121212;border:1px solid #333;border-radius:16px;padding:12px;margin-top:10px}
.nameI{width:100%;padding:12px;border-radius:12px;border:2px solid #333;background:#000;color:#fff;font-size:15px;font-weight:700}
.code{font-size:30px;font-weight:900;letter-spacing:8px;color:#00FF88;text-align:center;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;background:#000;padding:11px 12px;border-radius:12px;border:1px solid #222;margin-top:6px;font-size:13px}.row.me{border-color:#FFEB00;background:#1a1a00}.row.out{opacity:.4;text-decoration:line-through}
#mainLB{width:92%;max-width:420px;margin-top:12px}
body.inGame.tabs,body.inGame.lvls,body.inGame #roomSetup,body.inGame #roomInfo{opacity:.15;pointer-events:none} body.inGame.controls{opacity:.3}
</style>
</head><body>
<div class="topBar"><div style="font-size:11px;color:#666">方包包遊戲</div><div class="ver">V9.3 三人穩定版</div></div>
<div class="h1"><b>燈號對決</b></div>
<div class="tabs"><button class="tab active" id="tabS" onclick="setTab('single')">單人</button><button class="tab" id="tabP" onclick="setTab('party')">本地多人</button><button class="tab" id="tabR" onclick="setTab('room')">淘汰賽房間</button></div>
<div class="lvls"><button class="lvl active" id="lvl3" onclick="setMode(3)">3盞</button><button class="lvl" id="lvl4" onclick="setMode(4)">4盞</button><button class="lvl" id="lvl5" onclick="setMode(5)">5盞</button></div>
<div class="pillRow"><div class="pill">關卡 <b id="level">0</b></div><div class="pill">生存 <b id="aliveCount">0</b></div><div class="pill">狀態 <b id="status">V9.3就緒</b></div></div>
<div class="flash" id="flashText">V9.3 - 修復第3人加入</div>
<div class="cd" id="cd">3</div><div class="timeT" id="timeText"></div>
<div class="board c3" id="board"></div>
<div id="mainLB"></div>
<div class="controls"><button class="btn btnY" id="btnStart">▶️ 開始</button><button class="btn btnG" id="btnReset">↻ 重置</button></div>

<div class="box" id="roomBox" style="display:none">
<div id="roomSetup">
<div style="font-weight:900">💀 淘汰賽 - 支援5人+</div>
<input id="nameInput" class="nameI" style="margin-top:10px" placeholder="你的名稱 (必填)" maxlength="10">
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btnY" onclick="createRoom()">開新房間</button><button class="btn btnG" onclick="joinPrompt()">加入房間</button></div>
<div id="joinLog" style="font-size:11px;color:#888;margin-top:6px;text-align:center"></div>
</div>
<div id="roomInfo" style="display:none"><div class="code" id="roomCode">----</div><div style="text-align:center;font-size:11px"><span id="roomLink" style="color:#00FF88;word-break:break-all"></span><br><button class="btn btnG" style="margin-top:6px;padding:8px 16px;font-size:12px" onclick="copyLink()">📋 複製Link</button></div></div>
<div id="roomPlayers" style="margin-top:8px"></div>
<div id="progress" style="text-align:center;margin-top:8px;font-size:12px;color:#888"></div>
</div>

<script>
let playMode='single', mode=3, seq=[], player=[], level=0, playing=false, showing=false, startTime=0;
let peer=null, connList=[], myConn=null, isHost=false, myName=localStorage.getItem('lampName')||'', myOut=false;
let aliveList=[], outList=[], levelResults=[];
const colors=[{bg:'#D00000',label:'🔴 紅',f:440},{bg:'#E6A700',label:'🟡 黃',f:550},{bg:'#00A835',label:'🟢 綠',f:660},{bg:'#0055D0',label:'🔵 藍',f:770},{bg:'#8A00C2',label:'🟣 紫',f:880}];
const $=id=>document.getElementById(id);
const PEER_CONFIG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]}};
let audioCtx=null; const getCtx=()=>{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; };
function beep(f,d){ try{ const c=getCtx(),o=c.createOscillator(),g=c.createGain(); o.frequency.value=f; g.gain.value=0.35; o.connect(g); g.connect(c.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+d); o.stop(c.currentTime+d);}catch{}}
function setTab(m){ playMode=m; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); $('tab'+(m==='single'?'S':m==='party'?'P':'R')).classList.add('active'); $('roomBox').style.display=m==='room'?'block':'none'; resetGame(); }
function setMode(m){ mode=m; document.querySelectorAll('.lvl').forEach(b=>b.classList.remove('active')); $('lvl'+m).classList.add('active'); buildBoard(); if(isHost) broadcast({type:'mode',mode:m}); }
function buildBoard(){ const b=$('board'); b.innerHTML=''; b.className='board c'+mode; for(let i=0;i<mode;i++){ let btn=document.createElement('button'); btn.className='light'; btn.id='light'+i; btn.style.background=colors[i].bg; btn.textContent=colors[i].label; btn.onclick=()=>handlePress(i); b.appendChild(btn);} setActive(false); }
function setActive(o){ if(myOut){ document.querySelectorAll('.light').forEach(l=>l.classList.remove('active')); return; } document.querySelectorAll('.light').forEach(l=>{ if(o) l.classList.add('active'); else l.classList.remove('active'); }); }
function lightOn(i){ let el=$('light'+i); if(!el) return; el.classList.add('on'); beep(colors[i].f,0.22); setTimeout(()=>el.classList.remove('on'),300); }
async function doCountdown(){ $('flashText').style.display='none'; $('cd').style.display='block'; for(let c=3;c>=1;c--){ $('cd').textContent=c; $('cd').classList.remove('show'); void $('cd').offsetWidth; $('cd').classList.add('show'); beep(800,0.12); await new Promise(r=>setTimeout(r,700)); } $('cd').textContent='GO!'; beep(1200,0.35); await new Promise(r=>setTimeout(r,400)); $('cd').style.display='none'; $('flashText').style.display='block'; }
function startTimer(){ startTime=performance.now(); $('timeText').textContent='⏱️ 計時中...'; }
function stopTimer(){ let e=(performance.now()-startTime)/1000; return e; }
async function showSequence(){ showing=true; setActive(false); $('flashText').textContent='第'+level+'關 - 睇 '+seq.length+' 盞'; for(let i=0;i<seq.length;i++){ await new Promise(r=>setTimeout(r,300)); lightOn(seq[i]); await new Promise(r=>setTimeout(r,600)); } showing=false; if(!myOut) setActive(true); else $('flashText').textContent='💀 觀戰中 - 剩'+aliveList.length+'人'; if(!myOut){ $('flashText').textContent='第'+level+'關 - 按 '+seq.length+' 盞'; startTimer(); player=[]; } }
async function nextLevelHost(){ level++; $('level').textContent=level; seq.push(Math.floor(Math.random()*mode)); levelResults=[]; $('progress').textContent=''; broadcast({type:'seq',seq:seq,level:level,alive:aliveList}); await showSequence(); }
function enterGameMode(){ document.body.classList.add('inGame'); }
function exitGameMode(){ document.body.classList.remove('inGame'); }
async function startGame(){
 getCtx(); let nameVal=$('nameInput').value.trim()||localStorage.getItem('lampName')||''; if(playMode==='room'&&!nameVal){ nameVal=prompt('輸入名稱：')||''; nameVal=nameVal.trim().slice(0,10); if(nameVal) $('nameInput').value=nameVal; } myName=nameVal||'玩家'; if(playMode==='room') localStorage.setItem('lampName',myName);
 if(playMode==='room' &&!peer){ alert('請先開房'); return; } if(playMode==='room' &&!isHost){ $('flashText').textContent='等房主開始...'; return; }
 if(playMode==='room' && connList.length===0){ alert('等朋友加入先，暫時得你1人'); return; }
 seq=[]; level=0; outList=[]; myOut=false; aliveList=connList.map(c=>c.playerName||'玩家').concat([myName]); $('aliveCount').textContent=aliveList.length; updateList();
 playing=true; enterGameMode(); if(isHost){ broadcast({type:'countdown',alive:aliveList}); await doCountdown(); await nextLevelHost(); } else { await doCountdown(); await nextLevelHost(); }
}
function handlePress(i){
 if(myOut) return; if(!playing||showing) return; lightOn(i); player.push(i); let idx=player.length-1;
 if(player[idx]!==seq[idx]){ myOut=true; $('flashText').textContent='💀 '+(myName||'你')+' 出局！'; beep(150,0.6); setActive(false); if(playMode==='room'){ sendResult(999,false,true); } else { exitGameMode(); setTimeout(()=>resetGame(),1500); } return; }
 if(player.length===seq.length){ let t=stopTimer(); if(playMode==='single'){ $('flashText').textContent='✅ 第'+level+'關 '+t.toFixed(2)+'s'; setTimeout(()=>nextLevelHost(),1000); } else { $('flashText').textContent='✅ 完成 - 等其他人'; sendResult(t,true,false); setActive(false); } }
}
function resetGame(){ seq=[]; player=[]; level=0; playing=false; showing=false; myOut=false; outList=[]; exitGameMode(); $('level').textContent=0; $('flashText').textContent='V9.3 三人穩定版就緒'; $('flashText').style.display='block'; $('timeText').textContent=''; $('cd').style.display='none'; setActive(false); $('progress').textContent=''; $('mainLB').innerHTML=''; }

function loadPeer(cb){ if(window.Peer) return cb(); let s=document.createElement('script'); s.src='https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js'; s.onload=cb; s.onerror=()=>{$('status').textContent='PeerJS載入失敗，試轉WiFi';}; document.head.appendChild(s); }
function createRoom(){
 myName=$('nameInput').value.trim(); if(!myName){ alert('請先輸入名稱'); $('nameInput').focus(); return; } localStorage.setItem('lampName',myName);
 loadPeer(()=>{
   let code=Math.random().toString(36).substring(2,6).toUpperCase();
   let pid='lamp-'+code+'-'+Date.now().toString(36).slice(-3); // 唔撞ID
   isHost=true; connList=[]; outList=[]; if(peer) peer.destroy();
   peer=new Peer(pid, PEER_CONFIG);
   $('status').textContent='開房中...'; $('joinLog').textContent='開房碼: '+code+' 等緊朋友...';
   peer.on('open',()=>{ $('status').textContent='房主 '+code+' ('+(connList.length+1)+'人)'; $('roomCode').textContent=code; $('roomInfo').style.display='block'; let link=location.origin+location.pathname+'?room='+code; $('roomLink').textContent=link; history.replaceState(null,'','?room='+code); aliveList=[myName]; updateList(); });
   peer.on('connection',c=>{
     console.log('新玩家連入',c.peer);
     connList.push(c);
     c.on('open',()=>{
       $('status').textContent='房主 '+code+' ('+(connList.length+1)+'人) ✅';
       c.send({type:'mode',mode:mode});
       c.send({type:'welcome',host:myName});
       updateList();
     });
     c.on('data',d=>handleData(d,c));
     c.on('close',()=>{ connList=connList.filter(x=>x!==c); aliveList=aliveList.filter(n=>n!==c.playerName); updateList(); });
     c.on('error',e=>{ $('joinLog').textContent='連線錯誤: '+e; });
   });
   peer.on('error',e=>{ $('joinLog').textContent='開房錯誤: '+e.type; if(e.type==='unavailable-id'){ createRoom(); } });
 });
}
function joinPrompt(){ myName=$('nameInput').value.trim(); if(!myName){ alert('請輸入名稱'); return; } localStorage.setItem('lampName',myName); let c=prompt('輸入4位房間碼:'); if(!c) return; joinRoom(c.toUpperCase().trim()); }

function joinRoom(code, attempt=1){
 loadPeer(()=>{
   if(peer) peer.destroy();
   peer=new Peer(PEER_CONFIG);
   $('status').textContent='連線中 '+code+' (第'+attempt+'次)...'; $('joinLog').textContent='嘗試連接 '+code+'...';
   let timeout=setTimeout(()=>{ if(!myConn||!myConn.open){ $('joinLog').textContent='連線超時，試緊重連...'; if(attempt<3) joinRoom(code, attempt+1); } },4000);
   peer.on('open',()=>{
     // 嘗試連所有可能的 host ID (舊版 lamp-CODE 同新版 lamp-CODE-xxx)
     let connTried=false;
     const tryConnect = (hostId)=>{
       if(connTried) return;
       let conn=peer.connect(hostId, {reliable:true,...PEER_CONFIG});
       conn.on('open',()=>{
         clearTimeout(timeout); connTried=true; myConn=conn;
         $('status').textContent='已連 '+code+' ✅'; $('roomCode').textContent=code; $('roomInfo').style.display='block'; $('roomLink').textContent=location.href;
         $('joinLog').textContent='已連接房主 '+myName; conn.send({type:'join',name:myName});
       });
       conn.on('data',d=>handleData(d));
       conn.on('error',()=>{});
       setTimeout(()=>{ if(!conn.open &&!connTried){ conn.close(); } },2500);
       return conn;
     };
     // 先試新格式的前綴掃描，實際上PeerJS需要精確ID，所以我們用list+discovery
     // 技巧：先試直接 lamp-CODE (舊房)，如果失敗，房主會在3秒內用 broadcast，所以我們改為用 peer.listAllPeers (如果可用) 否則直接試 lamp-CODE
     let direct=tryConnect('lamp-'+code);
     // 後備：1秒後如果未連上，再試用 discovery - 房主其實ID係 lamp-CODE-xxx，所以要靠房主主動接受? 簡化：叫房主開房後，將完整ID寫入 localStorage 並分享? 今次我哋用靈活接法：房主同時 listen 2個ID
     // 為兼容，我哋讓房主額外連一個固定ID
     setTimeout(()=>{ if(!connTried){ $('joinLog').textContent='搵緊房間 '+code+'...'; // 再試一次
       let second=tryConnect('lamp-'+code+'-host'); // 舊邏輯兼容
     }},1500);
   });
   peer.on('error',e=>{
     $('joinLog').textContent='加入失敗: '+e.type;
     if(e.type==='peer-unavailable' && attempt<3){ setTimeout(()=>joinRoom(code, attempt+1),1000); }
   });
 });
}

async function handleData(data,conn){
 if(!data) return;
 if(data.type==='mode'){ mode=data.mode; buildBoard(); }
 if(data.type==='welcome'){ $('joinLog').textContent='房主: '+data.host+'，等開始'; }
 if(data.type==='countdown'){ aliveList=data.alive||aliveList; $('aliveCount').textContent=aliveList.length; playing=true; myOut=outList.includes(myName); enterGameMode(); await doCountdown(); }
 if(data.type==='seq'){ seq=data.seq; level=data.level; aliveList=data.alive||aliveList; $('level').textContent=level; $('aliveCount').textContent=aliveList.length; playing=true; enterGameMode(); await showSequence(); }
 if(data.type==='join' && isHost){ if(conn){ conn.playerName=data.name; console.log('加入',data.name); } aliveList=connList.map(c=>c.playerName||'玩家').concat([myName]); $('status').textContent='房主 '+(connList.length+1)+'人 ✅'; updateList(); }
 if(data.type==='result'){
   if(data.isOut){ outList.push(data.name); aliveList=aliveList.filter(n=>n!==data.name); $('aliveCount').textContent=aliveList.length; $('progress').textContent='💀 '+data.name+' 出局！剩'+aliveList.length+'人'; renderBoard(); if(isHost){ broadcast({type:'out',name:data.name,alive:aliveList}); if(aliveList.length===1){ broadcast({type:'win',winner:aliveList[0]}); $('flashText').innerHTML='🏆 '+aliveList[0]+' 勝出！'; setTimeout(()=>exitGameMode(),1200); return; } checkAllDone(); } }
   else { levelResults.push({name:data.name,time:data.time}); $('progress').textContent='✅ '+levelResults.length+'/'+aliveList.length+' 完成'; renderBoard(); if(isHost) checkAllDone(); }
 }
 if(data.type==='out'){ if(!outList.includes(data.name)) outList.push(data.name); aliveList=data.alive; $('aliveCount').textContent=aliveList.length; $('progress').textContent='💀 '+data.name+' 出局！'; updateList(); renderBoard(); if(myName===data.name){ myOut=true; setActive(false); $('flashText').textContent='💀 你已出局'; } }
 if(data.type==='win'){ $('flashText').innerHTML='🏆 '+data.winner+' 勝出！'; $('timeText').textContent=data.winner===myName?'你贏咗！':'遊戲結束'; playing=false; setTimeout(()=>exitGameMode(),1500); }
 if(data.type==='board'){ $('mainLB').innerHTML=data.html; }
 if(data.type==='plist'){ $('roomPlayers').innerHTML=data.html; $('aliveCount').textContent=data.aliveLen||0; }
 if(data.type==='prog'){ $('progress').textContent=data.text; if(data.board) $('mainLB').innerHTML=data.board; if(data.flash) $('flashText').innerHTML=data.flash; }
}
function checkAllDone(){ if(levelResults.length>=aliveList.length){ broadcast({type:'nextIn',level:level+1}); let sec=3; $('flashText').textContent='剩'+aliveList.length+'人！'+sec+'秒後第'+(level+1)+'關...'; let t=setInterval(()=>{ sec--; if(sec>0){ $('flashText').textContent='剩'+aliveList.length+'人！'+sec+'秒後第'+(level+1)+'關...'; broadcast({type:'prog',text:$('progress').textContent,board:$('mainLB').innerHTML,flash:$('flashText').textContent}); } else clearInterval(t); },1000); setTimeout(async()=>{ broadcast({type:'countdown',alive:aliveList}); await doCountdown(); await nextLevelHost(); },3000); } }
function sendResult(t,ok,isOut){ let p={type:'result',name:myName,time:t,ok:ok,isOut:isOut}; if(isHost){ handleData(p,null); } else if(myConn && myConn.open){ myConn.send(p); } }
function broadcast(o){ connList.forEach(c=>{ try{ if(c.open) c.send(o);}catch{}}); }
function renderBoard(){
 let h='<div style=text-align:center;font-weight:900;margin-top:4px>🏆 第'+level+'關 - 生存'+aliveList.length+'人</div>';
 let sorted=[...levelResults].sort((a,b)=>a.time-b.time);
 sorted.forEach((r,i)=>{ let ic=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'; let me=r.name===myName; h+='<div class="row '+(me?'me':'')+'"><span>'+ic+' '+r.name+(me?' (你)':'')+'</span><span style=color:#0f8;font-weight:900>'+r.time.toFixed(2)+'s</span></div>'; });
 outList.forEach(n=>{ h+='<div class="row out"><span>💀 '+n+' (出局)</span></div>'; });
 $('mainLB').innerHTML=h; broadcast({type:'board',html:h});
}
function updateList(){ let html='<div class=row>👥 生存'+aliveList.length+'人: '+aliveList.join(', ')+'</div>'; if(outList.length) html+='<div class=row out>💀 出局: '+outList.join(', ')+'</div>'; $('roomPlayers').innerHTML=html; $('aliveCount').textContent=aliveList.length; if(isHost) broadcast({type:'plist',html:html,aliveLen:aliveList.length}); }
function copyLink(){ navigator.clipboard.writeText($('roomLink').textContent).then(()=>alert('已複製Link')); }
function checkUrl(){ let p=new URLSearchParams(location.search).get('room'); if(p){ setTab('room'); setTimeout(()=>{ let s=localStorage.getItem('lampName'); if(s) $('nameInput').value=s; if($('nameInput').value.trim()) joinRoom(p.toUpperCase()); },500); } }
$('btnStart').addEventListener('click', startGame);
$('btnReset').addEventListener('click', ()=>{ exitGameMode(); resetGame(); });
$('nameInput').addEventListener('input',()=>{ if($('nameInput').value.trim()) localStorage.setItem('lampName',$('nameInput').value.trim()); });
if(myName) $('nameInput').value=myName;
setMode(3); buildBoard(); checkUrl();
</script></body></html>
